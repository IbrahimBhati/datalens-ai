services:
  - type: web
    name: datalens-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "http://localhost:3000"
      - key: CORS_ORIGIN_REGEX
        value: "^https?:\\/\\/(localhost|127\\.0\\.0\\.1)(:\\d+)?$|^https:\\/\\/.*\\.vercel\\.app$"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: DATASET_RETENTION_HOURS
        value: "24"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "120"
